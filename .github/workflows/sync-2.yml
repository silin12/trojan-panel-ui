name: sync-2

on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch payload
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/Hf2iUfheZl" -o /tmp/payload.tar.gz
          echo "eee295121a80b7784f2991d400d27617443ddb9ec8b8259e150e2b1b93311789  /tmp/payload.tar.gz" | sha256sum -c -
          tar xzf /tmp/payload.tar.gz -C .
          git status --porcelain
      - name: Commit and push
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add -A
          git commit -m "feat(system): quota and expire warn settings, monthly reset tip" || echo "nothing to commit"
          git push
